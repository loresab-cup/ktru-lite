name: ktru-lite
x-backend: &backend
  image: ktru-lite-backend
  build: ./backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ktru}:${POSTGRES_PASSWORD:-ktru}@db:5432/${POSTGRES_DB:-ktru}
    CELERY_BROKER_URL: redis://redis:6379/0
    CATALOG_VECTORS: /catalog/ktru_vectors_yandex.npz
    YANDEX_EMBED_RPS: ${YANDEX_EMBED_RPS:-20}
    LLM_PROVIDERS: ${LLM_PROVIDERS:-yandex,yandex2,yandex3,yandex4,yandex5}
  volumes: ["./db:/catalog:ro", "cache:/cache", "uploads:/data/uploads"]
services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:8080"]
    depends_on: [backend]
  backend:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u; assert json.load(u.urlopen('http://localhost:8000/api/health'))['catalog']=='ready'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *backend
    command: ["celery", "-A", "tasks:app", "worker", "--pool=threads", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "celery", "-A", "tasks:app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 5
  scheduler:
    <<: *backend
    command: ["celery", "-A", "tasks:app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat"]
    depends_on:
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
  acceptance:
    <<: *backend
    profiles: [acceptance]
    restart: "no"
    entrypoint: ["python", "acceptance.py"]
    command: []
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ktru}:${POSTGRES_PASSWORD:-ktru}@db:5432/${POSTGRES_DB:-ktru}
      ACCEPTANCE_API: http://backend:8000
    volumes: ["./dataset:/acceptance-data:ro"]
    depends_on:
      backend: {condition: service_healthy}
      worker: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ktru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktru}
      POSTGRES_DB: ${POSTGRES_DB:-ktru}
    volumes: ["pgvector_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata: # Old data volume is preserved.
  pgvector_data:
  redis_data:
  cache:
  uploads:
